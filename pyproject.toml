[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "PortFilterTest"
version = "1.0.0"
description = "Test whether an ISP is filtering inbound TCP/UDP ports"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "JGud007" }]
keywords = [
    "isp",
    "port-filtering",
    "inbound",
    "tcp",
    "udp",
    "firewall",
    "network-diagnostics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/JGud007/PortFilterTest"
Repository = "https://github.com/JGud007/PortFilterTest"
Issues = "https://github.com/JGud007/PortFilterTest/issues"

[project.scripts]
portfilter = "portfilter.cli:main"

[tool.setuptools]
packages = ["portfilter"]
